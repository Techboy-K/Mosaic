<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Mosaic Crew</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141928">
<link rel="icon" href="../assets/img/brand/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=PT+Sans:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/crew.css">
</head>
<body class="crew">
<div id="crew-shell"></div>
<main id="crew-main" hidden>

  <div class="crew-title"><div><h1>Settings</h1></div></div>
  <div class="panel-c" style="padding:20px;max-width:520px;display:flex;flex-direction:column;gap:14px;">
    <h2 style="font-size:16px">Notification sound</h2>
    <label class="pick"><input type="checkbox" id="set-sound"><span><b>Play a sound</b>
      <span>Short tones for new orders and ready plates</span></span></label>
    <label class="fld"><span>Volume</span><input type="range" id="set-vol" min="0" max="1" step="0.05"></label>
    <button class="btn btn--ghost btn--sm" id="set-test" style="align-self:flex-start">Test sound</button>
  </div>

</main>
<script src="../assets/js/vendor/supabase.min.js"></script>
<script src="../assets/js/crew/config.js"></script>
<script src="../assets/js/crew/auth.js"></script>
<script src="../assets/js/crew/shell.js"></script>
<script src="../assets/js/crew/orders.js"></script><script>
window.pageInit = function(c){
  var s=CrewOrders.Sound;
  var cb=document.getElementById('set-sound'), vol=document.getElementById('set-vol');
  cb.checked=s.enabled; vol.value=s.volume;
  cb.onchange=function(){ s.unlock(); s.setEnabled(cb.checked); };
  vol.oninput=function(){ s.setVolume(parseFloat(vol.value)); };
  document.getElementById('set-test').onclick=function(){ s.unlock(); s.play('order_ready'); };
};
</script><script>(async function(){var c = await Crew.requirePage('settings');if(!c) return;CrewShell.render(c);if (window.CrewNotify) CrewNotify.mount(c);document.getElementById("crew-main").hidden = false;if (window.pageInit) window.pageInit(c);})();</script></body>
</html>
